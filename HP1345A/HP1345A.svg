Font name: HP1345A
Format: SVG 1.1 single-line font
Converted to SVG 1.1 Font format from the p5.js inline HP1345A font archive.

Source: HP1345A/HP1345A_single_line_font_inline/sketch.js
Original font: character generator ROM of the HP1345A digital vector display, c.1985.
The HP1345A font was reverse-engineered by Poul-Henning Kamp and ported to JavaScript and SVG by Golan Levin.

Reference:
https://phk.freebsd.dk/hacks/Wargames/index.html
Original extraction resources:
https://phk.freebsd.dk/_downloads/e52aa694fd64ff9d2a1a7291b7697f3e/hp1345_font.py
https://phk.freebsd.dk/_downloads/a89c073235ca9c2b13d657173d32bf78/01347-80012.bin
https://phk.freebsd.dk/_downloads/2355976608a6359335e30a88e181f1fc/1816-1500.bin

This conversion includes only printable ASCII characters with known standard
Unicode mappings. ROM-specific symbols, including the HP logo and the box-like
glyph at byte 0x7E, are intentionally omitted.

Poul-Henning Kamp's Beer-Ware License notice:
----------------------------------------------------------------------------
"THE BEER-WARE LICENSE" (Revision 42):
&lt;phk@FreeBSD.org&gt; wrote this file. As long as you retain this notice you
can do whatever you want with this stuff. If we meet some day, and you think
this stuff is worth it, you can buy me a beer in return.   
Poul-Henning Kamp
----------------------------------------------------------------------------
