Font name: Apple 410
Format: SVG 1.1 single-line font
Converted to SVG 1.1 Font format from the p5.js Apple 410 font archive.

Source: apple_410_font/sketch.js
Original font: Apple 410 Color Plotter, also sold as the Yokogawa YEW PL-1000, c.1983.
The Apple 410 vector font was reverse-engineered and extracted from the firmware ROM by Adam Mayer (@phooky).
The p5.js/JSON/SVG version was adapted from Mayer's MIT-licensed Apple-410 repository by Golan Levin.

Reference:
https://www.nycresistor.com/2017/12/29/pulling-teeth-from-a-corpse-extracting-the-vector-font-from-the-apple-410-color-plotter/
Source repository:
https://github.com/phooky/Apple-410

This conversion includes printable ASCII characters with known standard Unicode mappings.
</metadata>
