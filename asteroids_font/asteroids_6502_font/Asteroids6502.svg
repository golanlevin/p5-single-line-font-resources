<metadata>
Font name: Asteroids 6502
Format: SVG 1.1 single-line font
Converted to SVG 1.1 Font format from the p5.js Asteroids 6502 font archive.

Source: asteroids_font/asteroids_6502_font/sketch.js
Original font: authentic vector font used in Asteroids, developed in 1979 for Atari by Lyle Rains and Ed Logg.
The font was extracted from 6502 microprocessor assembly instructions embedded in the ROMs of an Asteroids rev 4 arcade machine.

Disassembly credits:
Nick Mikstas, Lonnie Howell, and Mark McDougall.
Reformatting and corrections by Andy McFadden using 6502bench SourceGen v1.8.

References:
https://6502disassembly.com/va-asteroids/Asteroids.html
http://computerarcheology.com/Arcade/Asteroids/

This conversion uses the Ed Logg / Asteroids ROM-derived font, not Trammell Hudson's handwritten-note-derived version.
The source font contains uppercase Latin letters, digits, and space.
</metadata>
