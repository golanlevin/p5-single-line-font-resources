<metadata>
Font name: Commodore 1520
Format: SVG 1.1 single-line font
Converted to SVG 1.1 Font format from the p5.js Commodore 1520 font archive.

Source: commodore_1520_font/sketch.js
Original font: Commodore 1520 Printer Plotter, c.1982.
The ROM data was recovered by Jim Brain, Gerrit Heitsch, Silver Dream, and Stewart C Russell (scruss).
The font data was recovered by Stewart C Russell and ported to p5.js/SVG by Golan Levin.

References:
https://scruss.com/blog/2016/04/23/fifteentwenty-commodore-1520-plotter-font/
https://scruss.com/blog/2016/05/10/fifteentwenty-now-on-fontlibrary-and-github/
https://e4aws.silverdr.com/hacks/6500_1/
https://github.com/scruss/FifteenTwenty/blob/master/README.md

This conversion includes the source font's printable ASCII characters with known
standard Unicode mappings, plus Delta, pi, and white square.
</metadata>
