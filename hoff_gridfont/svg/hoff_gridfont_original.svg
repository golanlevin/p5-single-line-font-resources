Font name: Hoff GridFont Original
Format: SVG 1.1 single-line font

Source: hoff_gridfont/hoff_gridfont_original-all-data.json
Original font system: GridFont, a grid-based symbol and font design system by Anders Hoff, 2019.
Original Python project: https://github.com/inconvergent/gridfont
p5.js/SVG port by Golan Levin, April 2025. Used with permission.

This conversion uses the parsed path data from the JSON archive. Hoff's sample fonts
contain lowercase letters, digits, and symbols; they do not contain uppercase letters.
