<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd" >
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1">
<metadata>
Font name: Letter Spirit Zigzag
Format: SVG 1.1 single-line font
Converted to SVG 1.1 Font format from the p5.js Letter Spirit gridfont archive.

Source: hofstadter_letter_spirit_fonts/letter_spirit_fonts/sketch.js
Original gridfont style: Zigzag
Original project: Letter Spirit, c.1987-1996, by Douglas Hofstadter and Gary McGraw.

Reference:
Letter Spirit: An Emergent Model of the Perception and Creation of Alphabetic Style, 1993.
Local copy: hofstadter_letter_spirit_fonts/1993-hofstadter.pdf

Each glyph is encoded on the Letter Spirit 3 by 7 design lattice. This conversion
preserves the source stroke order and includes lowercase Latin letters present in
the source data, plus a space glyph.
</metadata>
