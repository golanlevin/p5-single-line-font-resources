Font name: Typode
Format: SVG 1.1 single-line font
Converted to SVG 1.1 Font format from the p5.js Typode font archive.

Source: moebio_typode/sketch.js
Original font: Typode, a procedural grid-based monospace single-stroke font by Santiago Ortiz / Moebio, 2013.
Typode was ported to p5.js and SVG by Golan Levin in January 2025 and is presented with permission.

Reference:
https://moebio.com/research/typode/

This conversion uses Typode's identity geometry, without the interactive point-transformation effects.
It includes source glyphs with known Unicode mappings, including Latin accented glyphs present in the data.
</metadata>
