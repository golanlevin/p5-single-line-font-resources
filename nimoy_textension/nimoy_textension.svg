Font name: Textension
Format: SVG 1.1 single-line font
Converted to SVG 1.1 Font format from the p5.js Textension font archive.

Source: nimoy_textension/sketch.js
Original font: handcoded monoline font from Textension: Word Processor Variations,
a Windows 95/98/XP program developed by JT Nimoy in 1999 at the Aesthetics &amp; Computation Group of the MIT Media Laboratory.

Recovery notes:
Textension font data was extracted by Kyle McDonald by decompiling Textension.exe
with Hex-Rays. The decompiled C++ was ported to p5.js and SVG by Golan Levin.

References:
https://jtnimoy.cc/item.php%3Fhandle=14882287-textension-word-processor-variations.html
https://player.vimeo.com/video/6121230
https://acid-play.com/download/textension

This conversion includes printable ASCII glyphs present in the recovered source data.
