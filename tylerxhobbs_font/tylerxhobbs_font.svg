Font name: Tyler X. Hobbs
Format: SVG 1.1 single-line font

Source: tylerxhobbs_font/tylerxhobbs_font/sketch.js
Original font: custom monospace monoline vector font by Tyler X. Hobbs, shared with
artists in the Feral File GRAPH exhibition sometime prior to 2021.
Republished with permission and ported from Clojure to p5.js/SVG by Golan Levin, March 2026.

References:
https://www.tylerxhobbs.com/
https://feralfile.com/explore/exhibitions/graph-eg6

This conversion includes source glyphs with known Unicode mappings. The source is
primarily uppercase; one lowercase c glyph is also present and included.
</metadata>
