<metadata>
Font name: GearGenerator
Format: SVG 1.1 single-line font

Source: vincze_geargenerator_font/sketch.js
Original font: compact single-line font embedded in Abel Vincze's GearGenerator.com
(Iparigrafika, version 1.01), used to label gears with ratio and RPM text.
The p5.js/SVG port is by Golan Levin, 2026.

Reference:
https://www.robopenguins.com/assets/wp-content/pages/geargenerator/index.html
http://geargenerator.com/

The source font encodes 73 printable characters on a 7 by 9 integer grid, with
all glyph stroke data compressed into three strings totaling under 1 KB.
</metadata>
